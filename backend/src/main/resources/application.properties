spring.application.name=blog

# Security and Logging
logging.level.org.springframework.security=${SECURITY_LOG_LEVEL:INFO}

# Datasource Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/blog}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${SPRING_JPA_FORMAT_SQL:false}
spring.jpa.open-in-view=false

# JWT Configuration
# In production, set JWT_SECRET to a strong base64-encoded 256-bit key
jwt.secret=${JWT_SECRET:dGVzdHNlY3JldGtleWZvcmJsb2dhcHBsaWNhdGlvbnRoYXRpc2F0bGVhc3QyNTZiaXRzbG9uZw==}
jwt.expiration=${JWT_EXPIRATION:86400000}
